<!doctype html>
<html><head><meta charset="utf-8"><title>Contact Form (inside iframe)</title>
<style>body{font-family:system-ui;padding:16px;margin:0;background:#fff;color:#111}
label{display:block;margin:8px 0 4px;font-size:13px;color:#333}
input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{margin-top:12px;padding:8px 16px;border:0;border-radius:4px;background:#2b8a4b;color:#fff;font-weight:600;cursor:pointer}
#status{margin-top:10px;color:#2b8a4b;font-size:13px}
</style></head><body>
<form id="contactForm">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" placeholder="Your name">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" placeholder="you@example.com">
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="3" placeholder="Say hi"></textarea>
  <button id="submitBtn" type="button">Submit</button>
  <div id="status"></div>
</form>
<script>
  document.getElementById('submitBtn').addEventListener('click', function () {
    document.getElementById('status').textContent = 'Submitted: ' +
      (document.getElementById('name').value || '(empty)');
  });
</script>
</body></html>
