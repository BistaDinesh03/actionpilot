<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ActionPilot Demo Shop</title><style>body{font:16px system-ui;max-width:900px;margin:0 auto;padding:40px;background:#f5f1e8;color:#252b27}header{display:flex;justify-content:space-between;align-items:center}input,button,select{padding:10px;border:1px solid #aaa;border-radius:5px;background:#fff}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:35px}.product{background:white;padding:18px;border-radius:8px}.product button{margin-top:10px}.muted{color:#68736b}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head>
<body><header><h1>Demo Shop</h1><span>Cart <b id="cart">0</b></span></header><p class="muted">Safe local site for teaching and replaying a workflow.</p><div id="app"></div>
<script>
const products=[{id:'keyboard',name:'Wireless Keyboard',description:'Compact wireless mechanical keyboard',variants:['Black','White']},{id:'lamp',name:'Desk Light',description:'Warm adjustable desk lamp',variants:['Black','Silver']},{id:'mouse',name:'Mouse Air',description:'Quiet ergonomic mouse',variants:['Black','White']}]; let query='';
function render(){const filtered=products.filter(product=>(product.name+' '+product.description).toLowerCase().includes(query.toLowerCase()));document.querySelector('#app').innerHTML=`<input id="search" placeholder="Search products" value="${query}" aria-label="Search products"><main>${filtered.map(product=>`<article class="product"><h2>${product.name}</h2><p>${product.description}</p><button data-product="${product.id}">Open product</button></article>`).join('')}</main>`;document.querySelector('#search').addEventListener('input',event=>{query=event.target.value;render()});document.querySelectorAll('[data-product]').forEach(button=>button.addEventListener('click',()=>showProduct(button.dataset.product)))}
function showProduct(id){const product=products.find(item=>item.id===id);if(!product)return;document.querySelector('#app').innerHTML=`<article class="product"><button id="back">Back to products</button><h2>${product.name}</h2><p>${product.description}</p><label>Variant <select id="variant" aria-label="Variant">${product.variants.map(variant=>`<option>${variant}</option>`).join('')}</select></label><br><button id="add">Add to cart</button></article>`;document.querySelector('#back').addEventListener('click',render);document.querySelector('#add').addEventListener('click',()=>{document.querySelector('#cart').textContent=Number(document.querySelector('#cart').textContent)+1})}
render();
</script></body></html>
