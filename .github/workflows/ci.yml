name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Windows)
    # pywinauto/pywin32 are Windows-only pins in backend/requirements.txt,
    # so the backend suite — including the local-browser E2E tests — runs
    # on Windows, the supported platform for the full backend.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm test
      - name: Build
        run: npm run build
