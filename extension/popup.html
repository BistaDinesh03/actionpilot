<!doctype html><html><head><meta charset="utf-8"><title>ActionPilot Recorder</title><style>body{width:250px;margin:0;padding:16px;background:#10161a;color:#e9f2ec;font:13px system-ui}h1{font-size:15px;margin:0 0 14px}p{color:#91a098;line-height:1.45}.status{padding:9px;background:#17231d;border-radius:6px;color:#9de2b3;margin:12px 0}.error{color:#ff9d9d;font-size:11px}.field{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:8px;border:1px solid #32423a;border-radius:5px;background:#0b1012;color:#eef8f1}button{width:100%;border:0;border-radius:5px;padding:9px;background:#8ce0ad;color:#122018;font-weight:700;cursor:pointer}button.stop{background:#f0aaa4}.hidden{display:none}</style></head><body><h1>ActionPilot Recorder</h1><div id="status" class="status">Checking connection...</div><div id="setup"><input id="name" class="field" placeholder="Task name"><input id="description" class="field" placeholder="Description (optional)"><button id="start">Start Teaching</button></div><button id="stop" class="stop hidden">Stop Teaching</button><p id="error" class="error"></p><script type="module" src="dist/popup.js"></script></body></html>
